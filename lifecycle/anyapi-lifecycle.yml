  url: null
  published: false
  note: >-
    NO status page. status.getanyapi.com does not resolve and getanyapi.com/status 404s.
    Deliberately NOT claimed as present. What the provider publishes instead is finer-grained
    but is not a status page: GET /catalog returns, for every one of the 363 SKUs, each serving
    lane's measured 30-day health - uptimePct, latencyP50Ms, uptimeSample and servedRequests -
    and GET /v1/apis/{sku} adds trailing-30-day p50/p95/p99 latency with the sample size. That
