apis:
  - name: AnyAPI Gateway API
    description: >-
      Unified REST gateway to 363 normalized scraping and data APIs, published as an OpenAPI 3.1.0 document with 370
      operations. Execute jobs via POST /v1/run/{sku}, browse and search the catalog without a key, fetch a SKU's
      normalized input/output JSON Schema with its USD pricing and measured 30-day latency, check wallet balance, and
      poll or re-read results. Every mutating operation accepts an Idempotency-Key. Also fronts a hosted MCP server,
      llms.txt, and published agent skills.
