pass_through_schemas:
  count: 30
  prefix: company_research_
  note: >-
    The only SKU whose response vocabulary is modelled in the gateway spec - an evidence-graph
    dossier (claim, claimEvidence, provenance, competitorProfile, fundingClaim, keyPerson,
    openRole, newsArticle, platformPresence, icpProfile, crawlCorpus, crawlPage and typed
    *Claim wrappers). Every other SKU's normalized input/output schema is served at runtime
    from the per-SKU describe endpoint rather than embedded here, which is why 363 operations share only
    20 core schemas.
observations:
  - >-
    Schema reuse is high and deliberate: 20 named schemas cover 370 operations because the
    per-SKU payloads are runtime-served JSON Schema rather than spec components.
  - >-
    Health and price are first-class, co-located model citizens. Every lane carries both, which
    is what makes the preferLatencyUnderMs routing preference a contract rather than a hint.
