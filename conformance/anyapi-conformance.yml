domain_standard:
  market: web data extraction / data-API aggregation
  standard_found: false
  note: >-
    REWARD-ONLY, and honestly empty. There is no interoperability standard for scraping or
    web-data APIs - no schema registry, no shared result vocabulary, no conformance profile a
    buyer could hold two vendors to. AnyAPI's own normalized-schema layer across 363 upstream
    sources is precisely the bilateral connector that such a standard would replace, and it is
    proprietary. Nothing is invented to fill this slot.
  scored_market_standards_checked: [none applicable]
