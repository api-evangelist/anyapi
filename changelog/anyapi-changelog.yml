scope_note: >-
  READ THE SCOPE. There is no API-level changelog: getanyapi.com/changelog 404s and no dated
  release notes for the gateway itself exist on the site or in the docs. What the provider does
  publish, dated and structured, is release history for its FIRST-PARTY CLIENTS - a Keep-a-
  Changelog CHANGELOG.md in the CLI repo and semver GitHub releases on the SDK monorepo. Those
  entries do surface gateway-side changes indirectly (the 0.3.2/0.3.3 entries below narrate a
  gateway cutover from credit-based to USD pricing), but they are client release notes and are
  recorded as such.
