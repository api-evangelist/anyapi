      description: 'Turn up to 99 email addresses into the people behind them: name, headline, location, LinkedIn profile, current title and seniority, full employment history, education, languages and skills, plus the employer record. Only the addresses it resolves are returned, and only those are billed.


        **Price:** billed per result - \$100.80 per 1,000 results, capped at \$9,979.20 per 1,000 requests.


        **Routing:** one lane serves this API today, so a failed attempt has nowhere to fail over to. Payment outcome follows the selected rail''s settlement policy.


        **Catalog:** Reverse Email Lookup - FullEnrich pricing and uptime - live USD price, lane routing, and measured 30-day uptime. Every Person_enrichment endpoint.'
      operationId: person_enrichment_fullenrich_reverse_email
      parameters:
      - description: 'Optional. Comma-separated keys (dotted paths like `author.name` descend into nested objects) to keep on each result item: each row of the API''s result list, or the `data` object itself for an API that returns one record. Keys are matched relative to that item, not against the top-level response envelope, so use `jq` to reshape the whole envelope. Shrinks the response without changing cost.'
