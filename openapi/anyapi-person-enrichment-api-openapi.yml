                                    type: string
                                  addressCountry:
                                    description: Address country.
                                    type: string
                                  addressState:
                                    description: Address state or region.
                                    type: string
                                  addressStreet:
                                    description: Street address.
                                    type: string
                                  addressZipcode:
                                    description: Address postal code.
                                    type: string
                                  companyId:
                                    description: BetterContact's own company identifier.
                                    type: string
                                  countryCode:
                                    description: ISO 3166-1 alpha-2 country code.
                                    type: string
                                  crunchbaseUrl:
                                    description: Company Crunchbase profile URL.
                                    format: uri
                                    type: string
                                  description:
                                    description: Company description.
                                    type: string
                                  directionsUrl:
                                    description: Map directions URL for the office.
                                    format: uri
                                    type: string
                                  domain:
                                    description: Company domain.
                                    type: string
                                  employees:
                                    description: Employees BetterContact counts.
                                    type: integer
                                  employeesOnLinkedin:
                                    description: Employees LinkedIn shows for the company.
                                    type: integer
                                  followers:
                                    description: LinkedIn follower count.
                                    type: integer
                                  founded:
                                    description: Year the company was founded.
                                    type: integer
                                  headquarters:
                                    description: Headquarters as one display string.
                                    type: string
                                  headquartersAddress:
                                    description: Headquarters street address.
                                    type: string
                                  headquartersCity:
                                    description: Headquarters city.
                                    type: string
                                  headquartersCountry:
                                    description: Headquarters country.
                                    type: string
                                  image:
                                    description: Company logo URL.
                                    format: uri
                                    type: string
                                  industryCode:
                                    description: Industry classification code.
                                    type: string
                                  legalId:
                                    description: Company registration number.
                                    type: string
                                  legalName:
                                    description: Registered legal name.
                                    type: string
                                  linkedinId:
                                    description: Company LinkedIn numeric id.
                                    type: string
                                  linkedinUrl:
                                    description: Company LinkedIn page URL.
                                    format: uri
                                    type: string
                                  name:
                                    description: Company name.
                                    type: string
                                  organizationType:
                                    description: Organization type.
                                    type: string
                                  phone:
