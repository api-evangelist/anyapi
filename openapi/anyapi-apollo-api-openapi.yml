                    - unverified
                    - likely to engage
                    - unavailable
                    type: string
                  type: array
                employeeRanges:
                  description: Organization employee-count ranges in Apollo notation, such as 51,200.
                  items:
                    minLength: 1
                    type: string
                  type: array
                excludeOrganizationDomains:
                  description: Exclude people whose current employer matches any of these domains. Every domain Apollo holds for that employer is excluded.
                  items:
                    minLength: 1
                    type: string
                  type: array
                headcountGrowthMonths:
                  description: Trailing window in months for the headcount growth filter. Takes effect only together with minHeadcountGrowthPercent or maxHeadcountGrowthPercent.
                  enum:
