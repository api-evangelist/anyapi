                  items:
                    minLength: 1
                    type: string
                  type: array
                  uniqueItems: true
                includeSimilarTitles:
                  description: Whether titles similar to the ones in titles also match. Set false for strict title matches only.
                  type: boolean
                jobPostedAtGte:
                  description: 'Only organizations with a job posted on or after this date. Format: YYYY-MM-DD.'
                  format: date
                  pattern: ^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$
                  type: string
                jobPostedAtLte:
