  /v1/run/company_enrichment.crustdata_v3:
    post:
      description: 'Enrich a company by domain, name, LinkedIn URL, or Crustdata identifier.


        **Price:** \$48.00 per 1,000 requests (flat per request - same cost regardless of results returned).


        **Routing:** one lane serves this API today, so a failed attempt has nowhere to fail over to. Payment outcome follows the selected rail''s settlement policy.


