openapi: 3.2.0
info:
  contact:
    email: support@getanyapi.com
  description: 'Any API, one wallet, USD, no subscriptions. Each API is a single discovered operation: send the normalized input, get a normalized result. Prices and payment outcomes are reported in USD; each operation documents the settlement policy for its enabled payment rails.'
  title: Any Substack API
  version: 1.0.0
  x-guidance: 'Use each operation''s published method and path with its normalized JSON input (see the operation requestBody). Before setting a client or tool timeout, GET /v1/apis/{sku} and inspect its trailing-30-day latency p50/p95/p99 and sample; p99 is an observation, not a maximum. To pay: send your AnyAPI key (Authorization: Bearer, billed from your USD wallet). For operations that advertise an inline rail, pay per call inline with x402 - call with no key, receive HTTP 402 with a PAYMENT-REQUIRED header, then retry with the PAYMENT-SIGNATURE header (base, no account needed); or pay per call inline with MPP (Machine Payments Protocol) - call with no key, receive HTTP 402 with a WWW-Authenticate: Payment challenge, then retry with the Authorization: Payment header (tempo, no account needed). x402 settles after execution; execution failure is reported as released; mpp settles before execution; execution failure is reported as charged_undelivered.'
servers:
- url: https://api.getanyapi.com
security:
- bearerAuth: []
- apiKeyAuth: []
tags:
- name: substack
  x-group: Substack
paths:
  /v1/run/substack.posts:
    post:
      description: 'Pull posts from any Substack publication by its URL, or pass a single post URL (…/p/slug) to fetch just that one article. Returns title, subtitle, publish date, paywall status, word count, engagement (reactions, comments, restacks), author profile, publication details, the full article body as text, HTML and Markdown, and optional comment threads.


        **Price:** billed per result - \$0.39 per 1,000 requests base + \$0.44 per 1,000 results, capped at \$44.40 per 1,000 requests.


        **Routing:** one lane serves this API today, so a failed attempt has nowhere to fail over to. Payment outcome follows the selected rail''s settlement policy.


        **Catalog:** Substack Posts pricing and uptime - live USD price, lane routing, and measured 30-day uptime. Every Substack endpoint.'
      operationId: substack_posts
      parameters:
      - description: 'Optional. Comma-separated keys (dotted paths like `author.name` descend into nested objects) to keep on each result item: each row of the API''s result list, or the `data` object itself for an API that returns one record. Keys are matched relative to that item, not against the top-level response envelope, so use `jq` to reshape the whole envelope. Shrinks the response without changing cost.'
        in: query
        name: fields
        required: false
        schema:
          type: string
      - description: Optional. Cap the number of result rows returned; a `_truncated` note reports how many were withheld so you can page via the API's own `limit`. An API that returns one record is not trimmed. Does not change cost.
        in: query
        name: max_items
        required: false
        schema:
          minimum: 0
          type: integer
      - description: Optional. Return only a structural outline (top-level keys, item counts, and per-field byte sizes) instead of the full data. Does not change cost.
        in: query
        name: summary
        required: false
        schema:
          type: boolean
      - description: 'Optional. A jq expression applied to the result envelope; its output replaces `output` (multiple outputs collect into an array). Reshape freely, e.g. `jq=.data | {title, description, md: .markdown[:3500]}`. Runs sandboxed with a 250ms / 2MB budget; on failure the full result is returned with a `jqError`. Does not change cost.'
        in: query
        name: jq
        required: false
        schema:
          type: string
      - description: Optional. The most you are willing to pay for this one request, in US dollars (for example 0.05). Any route that would charge more than this is not used, so a request only ever runs on something you can afford. If nothing is available at or below your amount, the request is refused before it runs, nothing is charged, and the message tells you the cheapest price per request so you can raise it. Leave it out to accept the normal price.
        in: query
        name: max_cost_usd
        required: false
        schema:
          type: string
      - description: Optional wallet idempotency key, scoped to this customer for 24 hours. When the gateway honors the key, this synchronous in-process execution can continue after the caller disconnects, bounded by its execution deadline. A completed replayable result charges normally exactly once and can be replayed without another provider run or charge. A pending duplicate returns 409 idempotency_in_progress; reuse with different request semantics returns 409 idempotency_conflict.
        in: header
        name: Idempotency-Key
        required: false
        schema:
          maxLength: 255
          minLength: 1
          type: string
      requestBody:
        content:
          application/json:
            example:
              limit: 3
              url: https://www.astralcodexten.com
            schema:
              additionalProperties: false
              example:
                limit: 3
                url: https://www.astralcodexten.com
              properties:
                allowFallbacks:
                  default: true
                  description: Optional, default true. When false, only the sources listed in `source` may serve; the request is refused with no charge if none of them can. When true, the listed sources are tried first and any other source may serve after them, at the normal price.
                  type: boolean
                contentType:
                  default: all
                  description: Restrict to a single post type, or 'all' (e.g. newsletter).
                  enum:
                  - all
                  - newsletter
                  - podcast
                  - thread
                  type: string
                endDate:
                  description: Only return posts published on or before this date, format YYYY-MM-DD (e.g. 2024-12-31). Applied within the most recent 'limit' posts scanned.
                  pattern: ^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$
                  type: string
                ignoreSources:
                  description: Optional. Source ids to skip for this request, taken from this endpoint's `lanes[].source.id`. The cheapest remaining source serves and the price is that of the dearest remaining source. An id that does not serve this endpoint, or that is also in `source`, is rejected as invalid input with no charge; skipping every source is rejected the same way.
                  items:
                    minLength: 1
                    type: string
                  type: array
                  uniqueItems: true
                includeComments:
                  default: false
                  description: Include public comment threads and their direct replies on each post (e.g. true).
                  type: boolean
                includeContent:
                  default: true
                  description: Include the full article body as text, HTML and Markdown. Set false for metadata only, which is faster (e.g. false).
                  type: boolean
                limit:
                  description: Maximum number of recent posts to return when given a publication URL (1-100, default 25); ignored for a single post URL, which always returns that one post. You are billed per post returned, so a lower limit costs less.
                  maximum: 100
                  minimum: 1
                  type: integer
                maxComments:
                  description: Maximum comments collected per post when 'includeComments' is true (0-500, default 20). Costs nothing extra (e.g. 50).
                  maximum: 500
                  minimum: 0
                  type: integer
                minComments:
                  description: Only return posts with at least this many comments (e.g. 10).
                  minimum: 0
                  type: integer
                minReactions:
                  description: Only return posts with at least this many reactions (e.g. 100).
                  minimum: 0
                  type: integer
                minWordCount:
                  description: Only return posts with at least this many words, which filters out short notes and announcements (e.g. 1000).
                  minimum: 0
                  type: integer
                onlyFree:
                  default: false
                  description: Return only free (non-paywalled) posts (e.g. true).
                  type: boolean
                preferLatencyUnderMs:
                  description: 'Optional; omit it and routing is unchanged, with the cheapest source serving. Prefer sources whose typical response time (median over the trailing 30 days, as published on this endpoint''s lane health) is under this many milliseconds; among those, the cheapest serves. This can raise your price: when the cheapest source misses the target, a faster and dearer one serves, and you are quoted and charged its price. If no source is that fast the request is still served, by whichever source offers the best speed for its price - it is never refused for being slow. Sources we have not timed are tried last. This is a preference, not a guarantee: the median describes past requests and is not a ceiling on this one, and it excludes any wait this request itself asks for. On a paginated walk it applies to the first page only: later pages stay with the source that page chose, at the price it was quoted.'
                  minimum: 1
                  type: integer
                source:
                  description: Optional. Source ids to prefer, in order, taken from this endpoint's `lanes[].source.id` in /catalog or /apis. Omit it and the cheapest source serves, with automatic failover. Listed sources are tried first in the order given, then the others, unless `allowFallbacks` is false. A single source with `allowFallbacks` false is served only by that source at its price, quoted and charged exactly, with no failover. The price is that of the dearest source that may serve. An id that does not serve this endpoint is rejected as invalid input with no charge; a listed source that is not serving right now is refused with no charge, so omit `source` to be served by another. On a paginated walk, later pages must include the source that served page one, or omit `source`.
                  items:
                    minLength: 1
                    type: string
                  type: array
                  uniqueItems: true
                startDate:
                  description: Only return posts published on or after this date, format YYYY-MM-DD (e.g. 2024-01-01). Applied within the most recent 'limit' posts scanned, so raise 'limit' to reach older date ranges.
                  pattern: ^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$
                  type: string
                url:
                  description: Either a Substack publication URL / custom domain to fetch its recent posts (e.g. https://www.astralcodexten.com), OR a single post URL to fetch just that one article with full content (e.g. https://www.astralcodexten.com/p/your-book-review).
                  type: string
              required:
              - url
              title: Substack posts input
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  costUsd:
                    description: USD charged on the original run. On a replay this value is echoed for parity; the replay itself is free.
                    type: number
                  hint:
                    description: 'Optional one-line nudge, absent when there is nothing to say. `large_result:` suggests the fields/max_items/summary/jq controls for a big response. `paging_unavailable:` means this result came from a source that cannot return a `nextCursor`, so it may be INCOMPLETE and cannot be continued - re-run with `requireFields: ["nextCursor"]` to be served only by a source that can page, which may cost more per request. `malformed_query:` means X read your search query differently than it looks (adjacent bare words are ANDed and OR binds tighter, so a multi-word alternative is not a phrase, and an operator after an unbracketed OR list applies to its last alternative only); the run was served and billed as X read it, and the hint carries the corrected query to send instead. `date_adjusted:` means a date you sent was outside the range the platform accepts, so the run used the nearest accepted date the hint names.'
                    type: string
                  items:
                    description: Number of result rows returned; an API that returns one record counts it as one row. For per-result APIs the per-item cost is charged against this count; for input-priced APIs the charge is per submitted input, independent of this count.
                    type: integer
                  jqError:
                    description: Present only when a `jq` expression failed; `output` then carries the full unshaped result and this explains why the reshape did not apply.
                    type: string
                  output:
                    anyOf:
                    - additionalProperties: false
                      properties:
                        data:
                          description: Result payload, or null when nothing was found.
                          oneOf:
                          - type: 'null'
                          - additionalProperties: false
                            properties:
                              items:
                                description: 'Post records: title, subtitle, URL, publish date, paywall status, word count, engagement (reactions, comments, restacks), author profile, publication details, the article body as text, HTML and Markdown, and comment threads when requested. Populated whenever the provider has data for the entity.'
                                items:
                                  properties:
                                    authorBio:
                                      description: Author bio as shown on their Substack profile.
                                      type: string
                                    authorHandle:
                                      description: Substack handle of the post author. Populated whenever the provider has data for the entity.
                                      type: string
                                      x-anyapi-must-populate: true
                                    authorImage:
                                      description: Profile photo URL of the post author.
                                      format: uri
                                      type: string
                                    authorName:
                                      description: Display name of the post author. Populated whenever the provider has data for the entity.
                                      type: string
                                      x-anyapi-must-populate: true
                                    authorUrl:
                                      description: Substack profile URL of the post author.
                                      format: uri
                                      type: string
                                    commentCount:
                                      description: Number of top-level comments on the post.
                                      type: integer
                                    comments:
                                      description: Top-level comment threads on the post, each with its direct replies. Empty unless 'includeComments' is true. Replies nested more than one level deep are not returned.
                                      items:
                                        properties:
                                          authorHandle:
                                            description: Substack handle of the comment author.
                                            type: string
                                          authorImage:
                                            description: Profile photo URL of the comment author.
                                            format: uri
                                            type: string
                                          authorName:
                                            description: Display name of the comment author.
                                            type: string
                                          authorUrl:
                                            description: Substack profile URL of the comment author.
                                            format: uri
                                            type: string
                                          commentId:
                                            description: Substack comment identifier.
                                            type: string
                                          createdUtc:
                                            description: UTC epoch timestamp in seconds (Unix time). Multiply by 1000 for a JS Date in milliseconds.
                                            type: number
                                          editedUtc:
                                            description: UTC epoch timestamp in seconds (Unix time). Multiply by 1000 for a JS Date in milliseconds.
                                            type: number
                                          isAuthor:
                                            description: Whether the comment was written by the post author.
                                            type: boolean
                                          isPinned:
                                            description: Whether the comment is pinned by the publication.
                                            type: boolean
                                          reactionCount:
                                            description: Number of reactions on the comment.
                                            type: integer
                                          replies:
                                            description: Direct replies to this comment.
                                            items:
                                              properties:
                                                authorHandle:
                                                  description: Substack handle of the reply author.
                                                  type: string
                                                authorImage:
                                                  description: Profile photo URL of the reply author.
                                                  format: uri
                                                  type: string
                                                authorName:
                                                  description: Display name of the reply author.
                                                  type: string
                                                authorUrl:
                                                  description: Substack profile URL of the reply author.
                                                  format: uri
                                                  type: string
                                                commentId:
                                                  description: Substack comment identifier.
                                                  type: string
                                                createdUtc:
                                                  description: UTC epoch timestamp in seconds (Unix time). Multiply by 1000 for a JS Date in milliseconds.
                                                  type: number
                                                editedUtc:
                                                  description: UTC epoch timestamp in seconds (Unix time). Multiply by 1000 for a JS Date in milliseconds.
                                                  type: number
                                                isAuthor:
                                                  description: Whether the reply was written by the post author.
                                                  type: boolean
                                                isPinned:
                                                  description: Whether the reply is pinned by the publication.
                                                  type: boolean
                                                reactionCount:
                                                  description: Number of reactions on the reply.
                                                  type: integer
                                                restackCount:
                                                  description: Number of times the reply was restacked.
                                                  type: integer
                                                text:
                                                  description: Reply body text.
                                                  type: string
                                              required:
                                              - commentId
                                              type: object
                                            type: array
                                          restackCount:
                                            description: Number of times the comment was restacked.
                                            type: integer
                                          text:
                                            description: Comment body text.
                                            type: string
                                        required:
                                        - commentId
                                        type: object
                                      type: array
                                    contentStatus:
                                      description: 'How much of the article body this record carries: ''full'' for the whole article, ''preview_only'' for the public excerpt of a paywalled post, ''metadata_only'' when no body was requested or available, or ''failed'' when extraction failed. Read this before trusting ''text'', ''html'', or ''markdown''. Populated whenever the provider has data for the entity.'
                                      type: string
                                      x-anyapi-must-populate: true
                                    createdUtc:
                                      description: UTC epoch timestamp in seconds (Unix time). Multiply by 1000 for a JS Date in milliseconds. Populated whenever the provider has data for the entity.
                                      type: number
                                      x-anyapi-must-populate: true
                                    description:
                                      description: Short post description, usually the subtitle or an excerpt.
                                      type: string
                                    hasVoiceover:
                                      description: Whether the post carries a narrated audio version.
                                      type: boolean
                                    html:
                                      description: Article body as HTML. Present when 'includeContent' is true and 'contentStatus' is 'full' or 'preview_only'.
                                      type: string
                                    image:
                                      description: Cover image URL.
                                      format: uri
                                      type: string
                                    isPaid:
                                      description: Whether the post is behind a paywall.
                                      type: boolean
                                    language:
                                      description: Two-letter language code of the post.
                                      type: string
                                    markdown:
                                      description: Article body as Markdown. Present when 'includeContent' is true and 'contentStatus' is 'full' or 'preview_only'.
                                      type: string
                                    podcastUrl:
                                      description: Audio URL for a podcast post or a narrated voiceover, when the post has one.
                                      format: uri
                                      type: string
                                    postId:
                                      description: Substack post identifier. Populated whenever the provider has data for the entity.
                                      type: string
                                      x-anyapi-must-populate: true
                                    postType:
                                      description: Post type (newsletter, podcast, or thread). Populated whenever the provider has data for the entity.
                                      type: string
                                      x-anyapi-must-populate: true
                                    publication:
                                      description: The publication the post belongs to.
                                      properties:
                                        customDomain:
                                          description: Custom domain the publication is served on, when it has one.
                                          type: string
                                        description:
                                          description: Publication tagline or hero text.
                                          type: string
                                        id:
                                          description: Substack publication identifier.
                                          type: string
                                        image:
                                          description: Publication logo URL.
                                          format: uri
                                          type: string
                                        language:
                                          description: Two-letter language code of the publication.
                                          type: string
                                        name:
                                          description: Publication name.
                                          type: string
                                        paymentsEnabled:
                                          description: Whether the publication sells paid subscriptions.
                                          type: boolean
                                        subdomain:
                                          description: Publication subdomain on substack.com.
                                          type: string
                                        subscriberCount:
                                          description: Subscriber count, when the publication publishes it.
                                          type: integer
                                        url:
                                          description: Publication home URL.
                                          format: uri
                                          type: string
                                      type: object
                                    reactionCount:
                                      description: Number of reactions (likes) on the post.
                                      type: integer
                                    replyCount:
                                      description: Number of replies to comments on the post.
                                      type: integer
                                    restackCount:
                                      description: Number of times the post was restacked.
                                      type: integer
                                    slug:
                                      description: Post slug, the last path segment of the post URL. Populated whenever the provider has data for the entity.
                                      type: string
                                      x-anyapi-must-populate: true
                                    subtitle:
                                      description: Post subtitle or deck.
                                      type: string
                                    text:
                                      description: Article body as plain text. Present when 'includeContent' is true and 'contentStatus' is 'full' or 'preview_only'.
                                      type: string
                                    title:
                                      description: Post title. Populated whenever the provider has data for the entity.
                                      type: string
                                      x-anyapi-must-populate: true
                                    updatedUtc:
                                      description: UTC epoch timestamp in seconds (Unix time). Multiply by 1000 for a JS Date in milliseconds.
                                      type: number
                                    url:
                                      description: Canonical post URL. Populated whenever the provider has data for the entity.
                                      format: uri
                                      type: string
                                      x-anyapi-must-populate: true
                                    wordcount:
                                      description: Approximate word count of the article.
                                      type: integer
                                  required:
                                  - title
                                  - url
                                  type: object
                                type: array
                                x-anyapi-must-populate: true
                            required:
                            - items
                            type: object
                        found:
                          description: Whether any posts were found for the request.
                          type: boolean
                        reason:
                          description: 'Present only when `found` is false, and says why there is no result. `not_found`: the source states the target does not exist, or returned nothing for it. A `found: false` answer is a successful call, not an error, and `costUsd` is what it actually cost.'
                          enum:
                          - not_found
                          type: string
                      required:
                      - found
                      - data
                      title: Substack posts output
                      type: object
                      x-anyapi-heavy: true
                    - type: 'null'
                    description: Normalized output, or null when the replay payload was not retained.
                  provider:
                    description: Always "AnyAPI".
                    type: string
                  replayed:
                    description: True when this response replays the durable result of an earlier run without billing or upstream execution.
                    type: boolean
                  resultId:
                    description: Opaque handle to the full unshaped result, cached ~15 min. Re-shape it for free (fields/max_items/summary/jq) via GET /v1/results/{id}, no re-billing. Absent when the result was too large to cache.
                    type: string
                  source:
                    description: The source that served this run. Pass its `id` back as `source` to prefer it again, or as `ignoreSources` to avoid it. Absent when no source identity applies to the run.
                    properties:
                      artworkKey:
                        description: Key for this source's artwork.
                        type: string
                      id:
                        description: Stable identifier for this source.
                        type: string
                      kind:
                        description: anonymous is a stable identity for an unattributed source; brand names the dataset that supplies the data.
                        enum:
                        - anonymous
                        - brand
                        type: string
                      name:
                        description: Display name for this source.
                        type: string
                    required:
                    - id
                    - name
                    - kind
                    - artworkKey
                    type: object
                required:
                - output
                - provider
                - costUsd
                - items
                - replayed
                type: object
          description: Normalized result.
          headers:
            Idempotency-Replayed:
              description: Present only when the request carried an Idempotency-Key this gateway honored. "false" means the key was claimed and the run executed freshly; "true" means it replayed a prior identical run and was NOT charged again. Absent means either no key was sent or this gateway does not honor keys, so a retry could be charged twice.
              schema:
                enum:
                - 'false'
                - 'true'
                type: string
            PAYMENT-RESPONSE:
              description: Inline x402 payment receipt.
              schema:
                type: string
            Payment-Receipt:
              description: Inline mpp payment receipt.
              schema:
                type: string
            X-PAYMENT-RESPONSE:
              description: Inline x402 payment receipt.
              schema:
                type: string
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Input did not match the schema, or the upstream rejected the request.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Missing or invalid API key.
        '402':
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/PaymentRequiredError'
                - $ref: '#/components/schemas/TrialCapReached'
            application/problem+json:
              schema:
                properties:
                  challengeId:
                    minLength: 1
                    type: string
                  status:
                    const: 402
                    type: integer
                required:
                - status
                - challengeId
                type: object
          description: Insufficient wallet balance or spend cap, or an inline-payment challenge. Agent trials receive a trial_cap_reached continuation with a live RFC 8628 device authorization.
          headers:
            PAYMENT-REQUIRED:
              description: Inline x402 payment challenge.
              schema:
                type: string
            WWW-Authenticate:
              description: Inline mpp payment challenge.
              schema:
                type: string
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'Unknown API. A target that does not exist is not a 404: the call succeeds with `output.found` false and `data` null.'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'Idempotency collision. Codes: idempotency_in_progress means retry after the Retry-After delay; idempotency_conflict means use a new key for different request semantics; idempotency_needs_review means stop retrying and contact AnyAPI support with X-Anyapi-Request-Id.'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The request was well formed but this API cannot serve the requested target site; the body's `alternatives` array lists the AnyAPI APIs that can.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The upstream was rate limited; resend the same request, with the same cursor if one was sent, after Retry-After seconds. Inspect `payment` when present before deciding whether to retry.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: An internal error prevented completion. Inspect payment when present before retrying.
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Every provider failed with a server/transport error, or inline payment settlement could not be confirmed; inspect `payment` when present before retrying.
      security:
      - bearerAuth: []
      - apiKeyAuth: []
      - {}
      summary: Substack Posts
      tags:
      - substack
      x-mint:
        href: /api-reference/substack/posts
      x-payment-info:
        price:
          currency: USD
          max: '0.044400'
          min: '0.000390'
          mode: dynamic
        protocols:
        - x402:
            asset: '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'
            network: eip155:8453
            payTo: '0x754BD2A6799e766B1E2b9f1Ae7fBdC0CeD96ef13'
            scheme: exact
        - mpp:
            asset: '0x20c000000000000000000000b9537d11c60e8b50'
            currency: USD
            intent: charge
            method: tempo
            network: tempo
            payTo: '0x754BD2A6799e766B1E2b9f1Ae7fBdC0CeD96ef13'
            rail: tempo
            scheme: exact
        rails:
        - headers:
            challenge:
            - PAYMENT-REQUIRED
            credential:
            - PAYMENT-SIGNATURE
            - X-PAYMENT
            receipt:
            - PAYMENT-RESPONSE
            - X-PAYMENT-RESPONSE
          pricing:
            currency: USD
            max: '0.044400'
            min: '0.001000'
            minimumUsd: '0.001000'
            mode: dynamic
            quoteBasis: floor
          protocol:
            asset: '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'
            network: eip155:8453
            payTo: '0x754BD2A6799e766B1E2b9f1Ae7fBdC0CeD96ef13'
            scheme: exact
