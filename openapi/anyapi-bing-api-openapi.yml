                                type:
                                - array
                                - 'null'
                              query:
                                description: The query Bing searched.
                                type: string
                              relatedSearches:
                                description: Bing's related searches for the query. An empty array means Bing showed none; null means the source that answered cannot report them.
                                items:
                                  type: string
                                type:
                                - array
                                - 'null'
                            required:
                            - query
                            - items
                            - relatedSearches
                            - peopleAlsoAsk
                            type: object
                        found:
                          description: Whether Bing returned organic results for the query.
                          type: boolean
                        reason:
                          description: 'Present only when `found` is false, and says why there is no result. `not_found`: the source states the target does not exist, or returned nothing for it. A `found: false` answer is a successful call, not an error, and `costUsd` is what it actually cost.'
                          enum:
                          - not_found
                          type: string
                      required:
