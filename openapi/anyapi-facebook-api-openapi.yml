                country:
                  description: Two-letter country code to scope results. Defaults to all countries.
                  type: string
                cursor:
                  description: Opaque pagination cursor from a previous response's nextCursor.
                  type: string
                endDate:
                  description: Filter to ads with impressions on or before this date, in YYYY-MM-DD format.
                  type: string
                language:
                  description: Two-letter language code to filter ads (e.g. "EN", "ES", "FR").
                  type: string
                mediaType:
                  description: Creative media type filter.
                  enum:
                  - ALL
                  - IMAGE
                  - VIDEO
                  - MEME
                  - IMAGE_AND_MEME
                  - NONE
