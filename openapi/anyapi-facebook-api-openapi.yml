  /v1/run/facebook.company_ads:
    post:
      description: 'List the Meta Ad Library ads a company is running by page ID or company name (creative text, format, platforms, and run dates) with cursor pagination.


        **Price:** \$2.00 per 1,000 requests (flat per request - same cost regardless of results returned).


        **Routing:** one lane serves this API today, so a failed attempt has nowhere to fail over to. Payment outcome follows the selected rail''s settlement policy.


        **Catalog:** Facebook Company Ads pricing and uptime - live USD price, lane routing, and measured 30-day uptime. Every Facebook endpoint.'
      operationId: facebook_company_ads
      parameters:
