                                    linkDescription:
                                      description: Variant secondary description.
                                      type: string
                                    linkUrl:
                                      description: Variant destination URL.
                                      type: string
                                    title:
                                      description: Variant headline.
                                      type: string
                                    videoPreviewImage:
                                      description: Poster frame for the creative video.
                                      type: string
                                    videoUrl:
                                      description: Creative video URL (HD when supplied, otherwise SD).
                                      type: string
                                  type: object
                                type: array
                              ctaText:
                                description: Call-to-action label (e.g. "Shop now").
                                type: string
                              ctaType:
                                description: Call-to-action type (e.g. "SHOP_NOW").
                                type: string
                              displayFormat:
                                description: Ad creative format (e.g. "DPA", "VIDEO", "IMAGE"). Populated whenever the provider has data for the entity.
                                type: string
                                x-anyapi-must-populate: true
                              endedUtc:
                                description: Run end, or last-seen date while the ad is still running. UTC epoch timestamp in seconds (Unix time). Multiply by 1000 for a JS Date in milliseconds.
                                type: number
                              images:
                                description: Standalone creative images for a single-image ad. Meta CDN media URLs are signed and expire.
                                items:
                                  properties:
                                    image:
                                      description: Original creative image URL.
                                      type: string
                                    imageResized:
                                      description: Resized creative image URL.
                                      type: string
                                  type: object
                                type: array
                              linkDescription:
                                description: Secondary link description line.
                                type: string
                              linkUrl:
                                description: Creative destination URL.
                                type: string
                              pageId:
                                description: Advertiser page ID (stable identity). Populated whenever the provider has data for the entity.
                                type: string
                                x-anyapi-must-populate: true
                              pageImage:
                                description: Advertiser page profile picture URL. Meta CDN URLs are signed and expire.
                                type: string
                              pageName:
                                description: Advertiser page name. Populated whenever the provider has data for the entity.
                                type: string
                                x-anyapi-must-populate: true
                              pageUrl:
                                description: Advertiser page URL.
                                type: string
                              platforms:
                                description: Publisher platforms the ad runs on.
                                items:
                                  type: string
                                type: array
                              sourceUrl:
                                description: Inspectable Meta Ad Library URL for this ad. Populated whenever the provider has data for the entity.
                                format: uri
                                type: string
                                x-anyapi-must-populate: true
                              startedUtc:
                                description: Run start. UTC epoch timestamp in seconds (Unix time). Multiply by 1000 for a JS Date in milliseconds.
