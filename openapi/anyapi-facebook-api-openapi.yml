                  enum:
                  - impressions
                  - recent
                  type: string
                startDate:
                  description: Filter to ads with impressions on or after this date, in YYYY-MM-DD format.
                  type: string
                status:
                  description: Ad status filter. Defaults to ACTIVE.
                  enum:
                  - ALL
                  - ACTIVE
                  - INACTIVE
                  type: string
              title: Facebook company ads input
              type: object
