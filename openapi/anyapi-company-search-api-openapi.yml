                                      - string
                                      - 'null'
                                    city:
                                      description: Headquarters city.
                                      type:
                                      - string
                                      - 'null'
                                    companyId:
                                      description: The source's own record identifier for this company, exposed so you can trace a result back to the record it came from.
                                      type:
                                      - string
                                      - 'null'
                                    continent:
                                      description: Headquarters continent.
                                      type:
                                      - string
                                      - 'null'
                                    country:
                                      description: Headquarters country.
                                      type:
                                      - string
                                      - 'null'
                                    crunchbaseUrl:
                                      description: Company Crunchbase URL.
                                      format: uri
                                      type:
                                      - string
                                      - 'null'
                                    description:
                                      description: Company description when available.
                                      type:
                                      - string
                                      - 'null'
                                    diversityInvestmentCount:
                                      description: Number of diversity-flagged investments the source records for the company.
                                      minimum: 0
