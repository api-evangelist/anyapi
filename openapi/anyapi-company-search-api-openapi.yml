                                    foundedYear:
                                      description: Year the company was founded.
                                      type: integer
                                    fundedUtc:
                                      description: UTC epoch timestamp in seconds (Unix time). Multiply by 1000 for a JS Date in milliseconds.
                                      type: integer
                                    fundingLastAmount:
                                      description: Amount raised in the most recent round in USD.
                                      minimum: 0
                                      type: integer
                                    fundingLastType:
                                      description: Type of the most recent funding round.
                                      type: string
                                    fundingRoundCount:
                                      description: Number of funding rounds raised.
                                      minimum: 0
                                      type: integer
                                    fundingRounds:
                                      description: Funding rounds the company has raised.
                                      items:
                                        properties:
                                          announcedUtc:
                                            description: UTC epoch timestamp in seconds (Unix time). Multiply by 1000 for a JS Date in milliseconds.
                                            type: integer
                                          investors:
                                            description: Investors named in this round.
                                            items:
                                              type: string
                                            type: array
                                          raisedAmount:
                                            description: Amount raised in this round in USD.
                                            minimum: 0
                                            type: integer
                                          type:
                                            description: Funding round type.
                                            type: string
                                        type: object
                                      type: array
                                    fundingTotalAmount:
                                      description: Total capital raised across all rounds in USD.
                                      minimum: 0
                                      type: integer
                                    hashtags:
                                      description: Hashtags the company publishes under.
                                      items:
                                        type: string
                                      type: array
                                    image:
                                      description: 'Company logo URL. This is a SIGNED, EXPIRING image-proxy URL - the path carries an exp: epoch roughly five days out - so fetch and store the image promptly rather than storing this URL.'
                                      format: uri
                                      type: string
                                    industries:
                                      description: Additional company industries.
                                      items:
                                        type: string
                                      type: array
                                    industry:
                                      description: Primary company industry.
                                      type: string
                                    investorCount:
                                      description: Number of distinct investors.
                                      minimum: 0
                                      type: integer
                                    keywords:
                                      description: Keywords describing the company.
                                      items:
                                        type: string
                                      type: array
                                    languages:
                                      description: Languages the company publishes in.
                                      items:
                                        type: string
                                      type: array
                                    latitude:
                                      description: Headquarters latitude in decimal degrees.
                                      type: number
                                    legalName:
                                      description: Registered company name when available.
                                      type: string
                                    linkedinUrl:
                                      description: Canonical company LinkedIn URL.
                                      format: uri
                                      type: string
                                    locations:
                                      description: Every office location the source lists for the company.
                                      items:
                                        properties:
                                          address:
                                            description: Location address as published by the source.
                                            type: string
                                          city:
                                            description: Location city.
                                            type: string
                                          continent:
                                            description: Location continent.
                                            type: string
                                          country:
                                            description: Location country.
                                            type: string
                                          latitude:
                                            description: Location latitude in decimal degrees.
                                            type: number
                                          longitude:
                                            description: Location longitude in decimal degrees.
                                            type: number
                                          postalCode:
                                            description: Location postal code.
                                            type: string
                                          state:
                                            description: Location state or region.
                                            type: string
                                        type: object
                                      type: array
                                    longitude:
                                      description: Headquarters longitude in decimal degrees.
                                      type: number
                                    naics:
                                      description: NAICS codes for the company.
                                      items:
                                        type: string
                                      type: array
                                    name:
                                      description: Company name.
                                      minLength: 1
                                      type: string
                                    overview:
                                      description: Longer company overview written by the source. Overlaps description but is a separately maintained blurb and is often longer or more current.
                                      type: string
                                    phone:
                                      description: Sanitized public company phone number.
                                      type: string
                                    phoneRaw:
                                      description: The same phone number in the source's unsanitized spelling, keeping spaces, dashes and brackets. Use phone for dialing and this for display fidelity.
                                      type: string
                                    postalCode:
                                      description: Headquarters postal code.
                                      type: string
                                    revenueMax:
