                                      type: string
                                    updatedUtc:
                                      description: UTC epoch timestamp in seconds (Unix time). Multiply by 1000 for a JS Date in milliseconds.
                                      type: integer
                                    websiteUrl:
                                      description: Canonical company website URL.
                                      format: uri
                                      type: string
                                  required:
                                  - name
