      description: 'Find websites running a given technology, category, or on-page term: domain, rank, detected stack, contacts, and social profiles as normalized JSON.


        **Price:** billed per result - \$12.00 per 1,000 requests base + \$1.20 per 1,000 results, capped at \$132.00 per 1,000 requests.


        **Routing:** one lane serves this API today, so a failed attempt has nowhere to fail over to. Payment outcome follows the selected rail''s settlement policy.


        **Catalog:** SEO Domains By Technology pricing and uptime - live USD price, lane routing, and measured 30-day uptime. Every Seo endpoint.'
      operationId: seo_domains_by_technology
