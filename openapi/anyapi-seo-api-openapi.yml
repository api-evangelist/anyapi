    post:
      description: 'Classify AnyAPI SEO keyword search intent as normalized JSON.


        **Price:** billed per keyword - \$14.38 per 1,000 requests base + \$0.16 per 1,000 keywords, capped at \$174.38 per 1,000 requests.


        **Routing:** one lane serves this API today, so a failed attempt has nowhere to fail over to. Payment outcome follows the selected rail''s settlement policy.


        **Catalog:** SEO Search Intent pricing and uptime - live USD price, lane routing, and measured 30-day uptime. Every Seo endpoint.'
      operationId: seo_search_intent
      parameters:
      - description: 'Optional. Comma-separated keys (dotted paths like `author.name` descend into nested objects) to keep on each result item: each row of the API''s result list, or the `data` object itself for an API that returns one record. Keys are matched relative to that item, not against the top-level response envelope, so use `jq` to reshape the whole envelope. Shrinks the response without changing cost.'
