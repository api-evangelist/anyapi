                                      type: string
                                      x-anyapi-must-populate: true
                                    cpc:
                                      description: Average paid-search cost per click in USD. Populated whenever the provider has data for the entity.
                                      type: number
                                      x-anyapi-must-populate: true
                                    depth:
                                      description: Related-keyword graph depth from the seed keyword. Populated whenever the provider has data for the entity.
                                      type: integer
                                      x-anyapi-must-populate: true
                                    keyword:
                                      description: Related keyword phrase. Populated whenever the provider has data for the entity.
                                      type: string
                                      x-anyapi-must-populate: true
                                    keywordDifficulty:
                                      description: Estimated organic ranking difficulty on a 0-100 scale. Populated whenever the provider has data for the entity.
                                      type: integer
                                      x-anyapi-must-populate: true
                                    searchIntent:
                                      description: Primary SEO search intent for the related keyword. Populated whenever the provider has data for the entity.
                                      type: string
                                      x-anyapi-must-populate: true
                                    searchVolume:
                                      description: Average monthly search volume for the related keyword. Populated whenever the provider has data for the entity.
                                      type: integer
                                      x-anyapi-must-populate: true
                                    updatedUtc:
                                      description: UTC epoch timestamp in seconds (Unix time). Multiply by 1000 for a JS Date in milliseconds.
                                      type: number
                                  required:
                                  - keyword
                                  type: object
                                type: array
                                x-anyapi-must-populate: true
                            required:
                            - relatedKeywords
                            type: object
                        found:
                          type: boolean
                      required:
                      - found
                      - data
                      title: SEO Related Keywords output
                      type: object
                    - type: 'null'
                    description: Normalized output, or null when the replay payload was not retained.
                  provider:
                    description: Always "AnyAPI".
                    type: string
                  replayed:
                    description: True when this response replays the durable result of an earlier run without billing or upstream execution.
                    type: boolean
                  resultId:
                    description: Opaque handle to the full unshaped result, cached ~15 min. Re-shape it for free (fields/max_items/summary/jq) via GET /v1/results/{id}, no re-billing. Absent when the result was too large to cache.
                    type: string
                required:
                - output
                - provider
                - costUsd
                - items
                - replayed
                type: object
          description: Normalized result.
          headers:
            Idempotency-Replayed:
              description: Present only when the request carried an Idempotency-Key this gateway honored. "false" means the key was claimed and the run executed freshly; "true" means it replayed a prior identical run and was NOT charged again. Absent means either no key was sent or this gateway does not honor keys, so a retry could be charged twice.
