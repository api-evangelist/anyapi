    post:
      description: 'Fetch one Google Jobs listing by the listingToken that google.jobs returns: title, company, location, the site it was found on, the full description, apply links on every board that carries it, the posting details Google shows (posted, pay, job type, benefits), and the employer''s ratings on review sites such as Glassdoor and Indeed when Google shows them.


