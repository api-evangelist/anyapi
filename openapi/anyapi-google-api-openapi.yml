                                    name:
                                      description: Business name. Populated whenever the provider has data for the entity.
                                      type: string
                                      x-anyapi-must-populate: true
                                    phone:
                                      description: Business phone number in E.164 format (e.g. +17205550123). Populated whenever the provider has data for the entity.
                                      type:
                                      - string
