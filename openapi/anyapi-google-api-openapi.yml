          minLength: 1
          type: string
      requestBody:
        content:
          application/json:
            example:
              prompt: How does photosynthesis work?
            schema:
              additionalProperties: false
              example:
                prompt: How does photosynthesis work?
              properties:
                allowFallbacks:
