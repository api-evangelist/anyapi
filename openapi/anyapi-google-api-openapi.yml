                    - additionalProperties: false
                      properties:
                        data:
                          description: The interest-over-time record, or null when nothing was found.
                          oneOf:
                          - type: 'null'
                          - additionalProperties: false
                            properties:
                              geo:
                                description: 'The place the series cover: the country or subdivision code you sent, or worldwide.'
                                type: string
                              series:
                                description: One series per search term, in the order you sent the terms. All series share one 0-100 scale. Populated whenever the provider has data for the entity.
                                items:
                                  properties:
                                    keyword:
                                      description: The search term this series charts. Populated whenever the provider has data for the entity.
                                      type: string
                                      x-anyapi-must-populate: true
                                    points:
                                      description: One point per time bucket, oldest first. Populated whenever the provider has data for the entity.
                                      items:
                                        properties:
                                          partial:
                                            description: True when Google is still counting this bucket, normally the newest one, so it reads lower than it will end. Present only when the source reports it.
                                            type: boolean
                                          startUtc:
                                            description: Start of the time bucket. UTC epoch timestamp in seconds (Unix time). Multiply by 1000 for a JS Date in milliseconds. Populated whenever the provider has data for the entity.
                                            type: number
                                            x-anyapi-must-populate: true
                                          value:
                                            description: Search interest in this bucket on Google's 0-100 scale, where 100 is the peak of any term in the response and 0 means there was not enough data. Populated whenever the provider has data for the entity.
                                            maximum: 100
                                            minimum: 0
                                            type: integer
                                            x-anyapi-must-populate: true
                                        required:
                                        - startUtc
                                        - value
                                        type: object
                                      type: array
                                      x-anyapi-must-populate: true
                                  required:
                                  - keyword
                                  - points
                                  type: object
                                type: array
                                x-anyapi-must-populate: true
                              timeframe:
                                description: 'The window the series cover: the timeframe you sent, or 12m when you sent none.'
                                type: string
                            required:
                            - geo
                            - timeframe
                            - series
                            type: object
                        found:
                          description: False when Google Trends holds too little search interest for these terms, place and window to chart them.
                          type: boolean
                        reason:
                          description: 'Present only when `found` is false, and says why there is no result. `not_found`: the source states the target does not exist, or returned nothing for it. A `found: false` answer is a successful call, not an error, and `costUsd` is what it actually cost.'
                          enum:
