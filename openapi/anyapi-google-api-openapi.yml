                                      type:
                                      - string
                                      - 'null'
                                      x-anyapi-must-populate: true
                                    cid:
                                      description: Google customer id (cid) of the business. Populated whenever the provider has data for the entity.
                                      type:
                                      - string
                                      - 'null'
                                      x-anyapi-must-populate: true
                                    highlights:
                                      description: Selling points the business lists, such as Flat rate pricing or Free in-home estimate. Null when this source does not report them.
                                      items:
                                        type: string
                                      type:
                                      - array
