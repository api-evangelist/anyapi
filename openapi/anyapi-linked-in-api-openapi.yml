    post:
      description: 'Find the deliverability-validated work email behind a LinkedIn profile URL or public ID. Returns each discovered email with its deliverability, validation status, and quality score, plus the person''s name and headline.


        **Price:** billed per result - \$11.00 per 1,000 requests base + \$0.00 per 1,000 results, capped at \$11.00 per 1,000 requests.


        **Routing:** one lane serves this API today, so a failed attempt has nowhere to fail over to. Payment outcome follows the selected rail''s settlement policy.


