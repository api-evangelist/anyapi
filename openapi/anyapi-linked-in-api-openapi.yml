      description: 'List a LinkedIn company page''s recent posts by URL: full text, canonical link, publish date, author, engagement counts with a per-reaction breakdown, and attached media.


        **Price:** \$5.00 per 1,000 requests (flat per request - same cost regardless of results returned).


        **Routing:** 2 independent lanes are available in execution order. A failed attempt uses the next lane only when the request''s payment authorizes that lane''s price; the normalized schema stays the same.


        **Catalog:** LinkedIn Company Posts pricing and uptime - live USD price, lane routing, and measured 30-day uptime. Every Linkedin endpoint.'
