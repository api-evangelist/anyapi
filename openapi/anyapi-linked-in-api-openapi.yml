    post:
      description: 'Cheap job index: title, company, location, posted date, URL. No description, salary, applicant counts, or seniority - for those use linkedin.jobs.


        **Price:** \$0.66 per 1,000 requests (flat per request - same cost regardless of results returned).


        **Routing:** 3 independent lanes are available in execution order. A failed attempt uses the next lane only when the request''s payment authorizes that lane''s price; the normalized schema stays the same.


        **Catalog:** LinkedIn Jobs (index) pricing and uptime - live USD price, lane routing, and measured 30-day uptime. Every Linkedin endpoint.'
