                authorCompanyNames:
                  description: Only return posts by people associated with these company names.
                  items:
                    minLength: 1
                    type: string
                  maxItems: 20
                  type: array
                authorIndustryIds:
                  description: Only return posts by authors associated with these LinkedIn industry IDs.
                  items:
                    minLength: 1
                    type: string
                  maxItems: 20
                  type: array
                authorKeywords:
                  description: Only return posts whose author profile headline or job title contains at least one of these keywords.
                  minLength: 1
                  type: string
                authorUrls:
                  description: Only return posts authored by these LinkedIn profile or company URLs.
                  items:
                    format: uri
                    type: string
                  maxItems: 10
                  type: array
                contentType:
                  description: Only return posts carrying this content type.
                  enum:
                  - all
                  - videos
                  - images
                  - jobs
                  - live-videos
                  - documents
                  - collaborative-articles
                  type: string
                datePosted:
                  default: last-day
                  description: Only return posts published within this relative time window. Last-hour and windows beyond one month route to the provider that supports them.
                  enum:
                  - last-hour
                  - last-day
                  - last-week
                  - last-month
                  - last-three-months
                  - last-six-months
                  - last-year
                  type: string
                ignoreSources:
                  description: Optional. Source ids to skip for this request, taken from this endpoint's `lanes[].source.id`. The cheapest remaining source serves and the price is that of the dearest remaining source. An id that does not serve this endpoint, or that is also in `source`, is rejected as invalid input with no charge; skipping every source is rejected the same way.
                  items:
                    minLength: 1
                    type: string
                  type: array
                  uniqueItems: true
                limit:
                  default: 10
                  description: Maximum number of posts to return (1-100, default 10). The upper bound is one LinkedIn search page.
                  maximum: 100
                  minimum: 1
                  type: integer
                mentioningMemberUrls:
                  description: Only return posts mentioning these LinkedIn member profile URLs.
                  items:
                    format: uri
                    type: string
                  maxItems: 10
                  type: array
                preferLatencyUnderMs:
                  description: 'Optional; omit it and routing is unchanged, with the cheapest source serving. Prefer sources whose typical response time (median over the trailing 30 days, as published on this endpoint''s lane health) is under this many milliseconds; among those, the cheapest serves. This can raise your price: when the cheapest source misses the target, a faster and dearer one serves, and you are quoted and charged its price. If no source is that fast the request is still served, by whichever source offers the best speed for its price - it is never refused for being slow. Sources we have not timed are tried last. This is a preference, not a guarantee: the median describes past requests and is not a ceiling on this one, and it excludes any wait this request itself asks for. On a paginated walk it applies to the first page only: later pages stay with the source that page chose, at the price it was quoted.'
                  minimum: 1
                  type: integer
                query:
                  description: LinkedIn post search query, including quoted terms or Boolean operators accepted by LinkedIn search.
                  minLength: 1
                  type: string
                requireFields:
                  description: 'Optional; omit it and routing is unchanged, with the cheapest source serving. Name the output fields this request must be able to return, for example `attachmentType` or `pollOptions`, and it is served only by a source that returns every one of them. Fields you do not name are still returned whenever the serving source has them. This can raise your price: when the cheapest source cannot return a named field, a dearer source serves, and you are quoted and charged its price. A named field can still be absent on a post that genuinely lacks it. Naming a combination that no single source returns together is refused as invalid input, with no charge.'
