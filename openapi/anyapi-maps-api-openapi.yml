                                    placeId:
                                      description: Google Maps place id (stable identifier for the place). Populated whenever the provider has data for the entity.
                                      type: string
                                      x-anyapi-must-populate: true
                                    postalCode:
                                      description: Postal code of the place.
                                      type: string
                                    priceLevel:
                                      description: Relative price level indicator (e.g. $, $10-20).
                                      type: string
                                    rating:
                                      description: Average star rating out of 5.
                                      type: number
                                    reviewCount:
                                      description: Total number of reviews.
                                      type: number
                                    state:
                                      description: State or region the place is in.
                                      type: string
                                    street:
                                      description: Street line of the address.
                                      type: string
                                    url:
                                      description: Canonical Google Maps URL for the place. Populated whenever the provider has data for the entity.
                                      type: string
                                      x-anyapi-must-populate: true
                                    website:
                                      description: The place's own website URL, when listed.
                                      type: string
                                  required:
