                                      x-anyapi-must-populate: true
                                    category:
                                      description: Primary Google Maps category (e.g. Coffee shop). Populated whenever the provider has data for the entity.
                                      type: string
                                      x-anyapi-must-populate: true
                                    city:
                                      type: string
                                    countryCode:
                                      description: Two-letter country code.
                                      type: string
                                    hours:
                                      description: 'Opening hours by day: each element is an object with the day name and its hours.'
                                      items:
                                        type: object
                                      type: array
                                    image:
                                      description: URL of the primary place photo.
                                      type: string
                                    latitude:
                                      description: Populated whenever the provider has data for the entity.
                                      type: number
                                      x-anyapi-must-populate: true
                                    longitude:
                                      description: Populated whenever the provider has data for the entity.
                                      type: number
                                      x-anyapi-must-populate: true
                                    name:
                                      description: Business or place name. Populated whenever the provider has data for the entity.
                                      type: string
                                      x-anyapi-must-populate: true
                                    neighborhood:
                                      type: string
                                    permanentlyClosed:
                                      description: Whether the place is permanently closed.
                                      type: boolean
                                    phone:
                                      description: Formatted phone number.
