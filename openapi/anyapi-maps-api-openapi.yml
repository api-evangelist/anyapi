                query: coffee
              properties:
                categoryFilterWords:
                  description: Optional list of Google Maps place-category names to keep; results are limited to places whose category matches one of these. Use lowercase category names as shown on Google Maps (e.g. ["coffee shop", "restaurant"]). Omit to include all categories and stay on the cheapest price; a category filter routes to a dearer source.
                  items:
                    type: string
                  type: array
                language:
                  default: en
                  description: Two-letter language code for the results (e.g. en).
                  type: string
                limit:
                  description: Maximum number of results to return (1-20, default 20). Pricing depends on the selected provider and may be flat per request.
                  maximum: 20
                  minimum: 1
                  type: integer
                location:
                  description: Free-text location to search in, ideally city plus country (e.g. Austin, USA).
                  minLength: 1
                  type: string
                placeMinimumStars:
                  description: 'Only return places with at least this average rating: two (2+), twoAndHalf (2.5+), three (3+), threeAndHalf (3.5+), four (4+), or fourAndHalf (4.5+). Places with no reviews are excluded. Omit this field to stay on the cheapest price; a rating floor routes to a dearer source.'
                  enum:
                  - two
                  - twoAndHalf
                  - three
                  - threeAndHalf
                  - four
                  - fourAndHalf
                  type: string
                preferLatencyUnderMs:
                  description: 'Optional; omit it and routing is unchanged, with the cheapest source serving. Prefer sources whose typical response time (median over the trailing 30 days, as published on this endpoint''s lane health) is under this many milliseconds; among those, the cheapest serves. This can raise your price: when the cheapest source misses the target, a faster and dearer one serves, and you are quoted and charged its price. If no source is that fast the request is still served, by whichever source offers the best speed for its price - it is never refused for being slow. Sources we have not timed are tried last. This is a preference, not a guarantee: the median describes past requests and is not a ceiling on this one, and it excludes any wait this request itself asks for. On a paginated walk it applies to the first page only: later pages stay with the source that page chose, at the price it was quoted.'
                  minimum: 1
                  type: integer
                query:
                  description: What you would type in the Google Maps search bar (e.g. coffee shop).
                  type: string
                website:
                  description: 'Filter places by whether they list a website: allPlaces (default), withWebsite (only places that have a website), or withoutWebsite (only places without one). Omit this field, or send allPlaces, to stay on the cheapest price; withWebsite and withoutWebsite route to a dearer source.'
                  enum:
                  - allPlaces
                  - withWebsite
                  - withoutWebsite
                  type: string
              required:
              - query
              - location
              title: Google Maps search input
              type: object
        required: true
      responses:
