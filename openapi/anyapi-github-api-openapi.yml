      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  costUsd:
                    description: USD charged on the original run. On a replay this value is echoed for parity; the replay itself is free.
                    type: number
                  hint:
                    description: 'Optional one-line nudge, absent when there is nothing to say. `large_result:` suggests the fields/max_items/summary/jq controls for a big response. `paging_unavailable:` means this result came from a source that cannot return a `nextCursor`, so it may be INCOMPLETE and cannot be continued - re-run with `requireCursor: true` to be served only by a source that can page, which may cost more per request.'
                    type: string
                  items:
                    description: Number of result rows returned. For per-result SKUs the per-item cost is charged against this count; for input-priced SKUs the charge is per submitted input, independent of this count.
                    type: integer
                  jqError:
                    description: Present only when a `jq` expression failed; `output` then carries the full unshaped result and this explains why the reshape did not apply.
                    type: string
                  output:
                    anyOf:
                    - additionalProperties: false
                      properties:
                        data:
                          description: The repository record, or null when not found.
                          oneOf:
                          - type: 'null'
                          - properties:
                              archived:
                                description: Whether the repository is archived.
                                type: boolean
                              createdUtc:
                                description: UTC epoch timestamp in seconds (Unix time). Multiply by 1000 for a JS Date in milliseconds. Populated whenever the provider has data for the entity.
                                type: number
                                x-anyapi-must-populate: true
                              defaultBranch:
                                description: Name of the default branch. Populated whenever the provider has data for the entity.
                                type: string
                                x-anyapi-must-populate: true
                              description:
                                description: Short repository description, or null if none.
                                type:
                                - string
                                - 'null'
                              fork:
                                description: Whether the repository is a fork.
                                type: boolean
                              forks:
                                description: Number of forks.
                                type: integer
                              fullName:
                                description: Full repository name in owner/name form. Populated whenever the provider has data for the entity.
                                type: string
                                x-anyapi-must-populate: true
                              homepage:
                                description: Project homepage URL, or null if none.
                                type:
                                - string
                                - 'null'
                              language:
                                description: Primary programming language, or null if undetected.
                                type:
                                - string
                                - 'null'
                              license:
                                description: License name, or null if unlicensed.
                                type:
                                - string
                                - 'null'
                              name:
                                description: Repository short name (without owner). Populated whenever the provider has data for the entity.
                                type: string
                                x-anyapi-must-populate: true
                              openIssues:
                                description: Count of open issues and pull requests.
                                type: integer
                              owner:
                                description: Login of the repository owner (user or organization). Populated whenever the provider has data for the entity.
                                type: string
                                x-anyapi-must-populate: true
                              pushedAt:
                                description: Last push timestamp (ISO 8601). Populated whenever the provider has data for the entity.
                                type: string
                                x-anyapi-must-populate: true
                              stars:
                                description: Number of stargazers.
                                type: integer
                              topics:
                                description: Repository topic tags.
                                items:
                                  type: string
                                type: array
                              updatedAt:
                                description: Last metadata update timestamp (ISO 8601). Populated whenever the provider has data for the entity.
                                type: string
                                x-anyapi-must-populate: true
                              url:
                                description: Canonical URL of the repository. Populated whenever the provider has data for the entity.
                                type: string
                                x-anyapi-must-populate: true
                              watchers:
                                description: Number of watchers.
                                type: integer
                            required:
                            - name
                            - fullName
                            - url
                            type: object
                        found:
                          description: Whether a repository was found for the requested URL.
                          type: boolean
                      required:
                      - found
                      - data
                      title: GitHub repository output
                      type: object
                    - type: 'null'
                    description: Normalized output, or null when the replay payload was not retained.
                  provider:
                    description: Always "AnyAPI".
                    type: string
                  replayed:
                    description: True when this response replays the durable result of an earlier run without billing or upstream execution.
                    type: boolean
                  resultId:
                    description: Opaque handle to the full unshaped result, cached ~15 min. Re-shape it for free (fields/max_items/summary/jq) via GET /v1/results/{id}, no re-billing. Absent when the result was too large to cache.
                    type: string
                required:
                - output
                - provider
                - costUsd
                - items
                - replayed
                type: object
          description: Normalized result.
          headers:
            Idempotency-Replayed:
              description: Present only when the request carried an Idempotency-Key this gateway honored. "false" means the key was claimed and the run executed freshly; "true" means it replayed a prior identical run and was NOT charged again. Absent means either no key was sent or this gateway does not honor keys, so a retry could be charged twice.
