components:
  schemas:
    AgentUpgrade:
      properties:
        authorizationServer:
          format: uri
          type: string
        clientId:
          type: string
        device:
          $ref: '#/components/schemas/DeviceUpgrade'
        scope:
          type: string
      required:
      - authorizationServer
      - scope
      type: object
    Payment:
      properties:
        costUsd:
          description: Known USD payment amount for this request.
          minimum: 0
          type: number
        rail:
          minLength: 1
          type: string
        settlementState:
          enum:
          - charged_undelivered
          - indeterminate
          type: string
      required:
      - rail
      - settlementState
      - costUsd
      type: object
    Error:
      properties:
        code:
          description: Stable machine-readable error code when the endpoint defines one.
          type: string
        error:
          description: Customer-safe error message.
          type: string
        payment:
          $ref: '#/components/schemas/Payment'
        requestId:
          description: This run's AnyAPI request id, the same value as the X-Anyapi-Request-Id response header. Quote it to support. Absent on endpoints that do not execute a run.
          format: uuid
          type: string
      required:
      - error
      type: object
    PaymentRequiredError:
      allOf:
      - $ref: '#/components/schemas/Error'
      - properties:
          error:
            not:
              const: trial_cap_reached
        type: object
    DeviceUpgrade:
      properties:
        deviceCode:
          type: string
        expiresIn:
          minimum: 0
          type: integer
        grantType:
          type: string
        interval:
          minimum: 1
          type: integer
        tokenEndpoint:
          format: uri
          type: string
        userCode:
          type: string
        verificationUri:
          format: uri
          type: string
        verificationUriComplete:
          format: uri
          type: string
      required:
      - verificationUriComplete
      - verificationUri
      - userCode
      - deviceCode
      - tokenEndpoint
      - grantType
      - interval
      - expiresIn
      type: object
    TrialCapReached:
      properties:
        error:
          const: trial_cap_reached
          type: string
        message:
          description: Human-relayable continuation instructions, including an executable token poll.
          type: string
        upgrade:
          $ref: '#/components/schemas/AgentUpgrade'
      required:
      - error
      - message
      - upgrade
      type: object
    RequestSnapshot:
      properties:
        completedAt:
          format: date-time
          type: string
        createdAt:
          format: date-time
          type: string
        error:
          properties:
            code:
              type: string
          required:
          - code
          type: object
        expiresAt:
          format: date-time
          type: string
        requestId:
          format: uuid
          type: string
        result:
          properties:
            costUsd:
              description: USD charged on the ORIGINAL run, echoed for envelope parity; this re-read is free.
              type: number
            items:
              description: Number of result rows returned by the original run.
              type: integer
            jqError:
              description: Present only when a `jq` expression failed; `output` then carries the full unshaped result and this explains why the reshape did not apply.
              type: string
            output:
              description: The normalized result (`{found, data}` by default), re-shaped by any fields/max_items/summary/jq params. Open shape - a jq expression may replace it with an array or scalar.
            provider:
              description: Always "AnyAPI".
              type: string
            replayed:
              description: False on this cached-result endpoint; true is reserved for durable idempotency replays from POST /v1/run/{sku}.
              type: boolean
            resultId:
              description: The id you requested, echoed so you can keep re-reading the same cached result.
              type: string
          required:
          - output
          - provider
          - costUsd
          - items
          - replayed
          type: object
        resultExpired:
          type: boolean
        retryAfterSeconds:
          minimum: 1
          type: integer
        serviceOutcome:
          description: End-to-end AnyAPI service result when known; independent of payment settlement.
          enum:
          - served
          - valid_negative
          - caller_error
          - service_failure
          - rejected
          type: string
        settlementState:
          description: Payment settlement state when known; independent of request lifecycle status.
          enum:
          - not_required
          - pending
          - settled
          - reconcile
          - charged_undelivered
          - writeoff
          type: string
        sku:
          type: string
        status:
          enum:
          - queued
          - running
          - succeeded
          - failed
          - expired
          type: string
      required:
      - requestId
      - sku
      - status
      - createdAt
      type: object
  securitySchemes:
    apiKeyAuth:
      description: Your AnyAPI key.
      in: header
      name: X-API-Key
      type: apiKey
      x-default: YOUR_ANYAPI_KEY
    bearerAuth:
      description: Your AnyAPI key as a Bearer token.
      scheme: bearer
      type: http
      x-default: YOUR_ANYAPI_KEY
