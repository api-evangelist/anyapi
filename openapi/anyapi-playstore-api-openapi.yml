                  description: Optional, default true. When false, only the sources listed in `source` may serve; the request is refused with no charge if none of them can. When true, the listed sources are tried first and any other source may serve after them, at the normal price.
                  type: boolean
                appId:
                  description: Android app package name or full Google Play store URL (e.g. com.supercell.brawlstars).
                  type: string
                appVersion:
                  description: Only return reviews left on these app versions (e.g. ["2.24.1", "2.24.2"]).
                  items:
                    type: string
                  type: array
                deviceType:
                  description: Only return reviews from this device type (e.g. "tablet"); omit for the provider default.
                  enum:
                  - mobile
                  - tablet
                  - chromebook
                  type: string
                endDate:
                  description: Only return reviews on or before this date, inclusive, in YYYY-MM-DD format (e.g. 2026-06-30).
