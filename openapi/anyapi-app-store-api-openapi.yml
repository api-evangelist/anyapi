                                type: string
                                x-anyapi-must-populate: true
                              releasedUtc:
                                description: UTC epoch timestamp in seconds (Unix time). Multiply by 1000 for a JS Date in milliseconds. When the app was first released.
                                type:
                                - number
                                - 'null'
                              reviewSamples:
