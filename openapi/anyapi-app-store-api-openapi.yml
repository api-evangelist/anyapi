                                      items:
                                        type: string
                                      type:
                                      - array
                                      - 'null'
                                    title:
                                      description: Kind of data use (e.g. Data Linked to You).
                                      type: string
                                  required:
                                  - title
                                  type: object
                                type:
                                - array
                                - 'null'
                              rating:
                                description: Average star rating, 0 to 5. Populated whenever the provider has data for the entity.
                                type: number
                                x-anyapi-must-populate: true
                              ratingCount:
                                description: Number of star ratings the app has in this storefront (ratings, not written reviews).
                                type:
                                - integer
                                - 'null'
                              ratingHistogram:
                                description: Number of ratings at each star level.
                                properties:
                                  fiveStar:
                                    description: Number of 5-star ratings.
                                    type:
                                    - integer
                                    - 'null'
                                  fourStar:
                                    description: Number of 4-star ratings.
                                    type:
                                    - integer
                                    - 'null'
                                  oneStar:
