                  minimum: 0
                  pattern: ^0*(?:[0-9]|[1-4][0-9]|50)$
                  type:
                  - integer
                  - string
                objective:
                  description: Campaign objective filter.
                  enum:
                  - app_installs
                  - conversions
                  - lead_generation
                  - product_sales
                  - reach
                  - traffic
