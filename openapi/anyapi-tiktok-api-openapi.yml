                  type: string
                cursor:
                  description: Search cursor from a previous response's nextCursor.
                  type: string
                days:
                  default: 30
                  description: Number of days of Commercial Content Library history to search, from 1 to 365. Defaults to 30.
                  maximum: 365
                  minimum: 1
                  type: integer
                limit:
                  default: 20
                  description: Maximum number of ads to return, from 1 to 50. Defaults to 20. Billing is flat per request.
                  maximum: 50
                  minimum: 1
                  type: integer
                offset:
                  default: 0
                  description: Zero-based result offset. Defaults to 0.
                  minimum: 0
                  type: integer
