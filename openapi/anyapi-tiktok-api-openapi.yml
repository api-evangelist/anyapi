                                      type: string
                                    width:
                                      description: Pixel width of the image.
                                      type: integer
                                  required:
                                  - image
                                  type: object
                                type: array
                                x-anyapi-must-populate: true
                              likes:
                                description: Like count.
                                type: integer
                              region:
                                description: Two-letter region code the post was published from.
                                type: string
                              saves:
                                description: Save count.
