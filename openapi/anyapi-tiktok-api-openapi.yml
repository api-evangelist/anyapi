                  - ko
                  type: string
                advertiserName:
                  description: Filter to a specific advertiser by name (searches the public TikTok Ads Library by advertiser).
                  type: string
                cursor:
                  description: Page number for pagination (defaults to 1).
                  type: string
                duration:
                  description: Video duration bucket filter.
                  enum:
                  - under_10s
                  - 10_20s
                  - 20_30s
                  - 30_40s
