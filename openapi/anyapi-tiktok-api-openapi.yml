  /v1/run/tiktok.ad_transparency_search:
    post:
      description: 'Search TikTok''s EU Commercial Content Library by keyword or advertiser ID.


        **Price:** \$0.90 per 1,000 requests (flat per request - same cost regardless of results returned).


        **Routing:** one lane serves this API today, so a failed attempt has nowhere to fail over to. Payment outcome follows the selected rail''s settlement policy.


        **Catalog:** TikTok Ad Transparency Search pricing and uptime - live USD price, lane routing, and measured 30-day uptime. Every TikTok endpoint.'
      operationId: tiktok_ad_transparency_search
      parameters:
