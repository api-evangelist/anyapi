                                type: string
                            required:
                            - transcript
                            type: object
                        found:
                          type: boolean
                        reason:
                          description: 'Present only when `found` is false, and says why there is no result. `not_found`: the source states the target does not exist, or returned nothing for it. A `found: false` answer is a successful call, not an error, and `costUsd` is what it actually cost.'
                          enum:
                          - not_found
                          type: string
                      required:
                      - found
                      - data
                      title: TikTok video transcript output
                      type: object
                      x-anyapi-heavy: true
                    - type: 'null'
